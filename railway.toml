# Railway deployment. Attach a volume mounted at /data (Service → Volumes) and set the
# AGAME_* variables from .env.example in the service's Variables tab. See docs/deployment.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
