[project]
name = "agame"
version = "1.0.0"
description = "Private HealthKit-powered fitness dashboard (Strava + Bevel feature set) built by a daily agent."
requires-python = ">=3.11"
dependencies = []  # runtime is Python standard library only

[project.optional-dependencies]
# Browser tests use the Node Playwright package (see README.md §10).
dev = []

[tool.agame]
data_dir_env = "AGAME_DATA_DIR"
default_timezone = "Africa/Kigali"
